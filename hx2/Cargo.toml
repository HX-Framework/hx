[package]
name = "hx2"
version = "78.0.0"
edition = "2021"
rust-version = "1.80"
publish = false
description = "hx2: the hx client, ported to Rust as an exact copy of the TypeScript client (HX2 program, M3 to M5)"
license = "MIT"
build = "build.rs"

[[bin]]
name = "hx2"
path = "src/main.rs"

[dependencies]
# Local-time stamps on the daemon's log lines (the TypeScript client stamps
# with the process's local time zone, which the TZ variable selects).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# File events as hints: FSEvents on macOS, inotify on Linux, the same role
# fs.watch(recursive) plays in src/fs-events.ts.
notify = "7"
# sha1 content hashes for the hash-gated sidecar uploads (artifacts.ts hashContent).
sha1 = "0.10"
# SIGTERM / SIGINT: fold the journal, then end the way the default handler would.
signal-hook = "0.3"
libc = "0.2"
# The catalog's maps keep discovery order, as the TypeScript client's Maps do:
# the order a pass hands files to the upload pool is visible to a refusing gateway.
indexmap = "2"
# Codex keeps its session titles in ~/.codex/state_<N>.sqlite (codex-titles.ts
# reads it with bun:sqlite); the bundled SQLite keeps the build self-contained.
rusqlite = { version = "0.32", features = ["bundled"] }
# HTTPS to the hosted gateway, a fortress and the download proxy. Bun's fetch
# trusts the Mozilla root store it bundles (plus NODE_EXTRA_CA_CERTS); the
# same Mozilla roots are compiled in here. ring is also the source of the
# sha256, the HMAC and the random tokens of `hx ui` and `hx update`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
ring = "0.17"
# Bun's fetch advertises `accept-encoding: gzip, deflate, br, zstd` and decodes
# whatever the server picks; the Cloudflare edge in front of let.ai compresses.
# flate2 also unpacks the gzipped release asset of `hx update`.
flate2 = "1"
brotli-decompressor = "4"
zstd = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
