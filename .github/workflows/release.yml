name: Release

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "ui/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: hx-release
  cancel-in-progress: false

jobs:
  release:
    name: Cross-compile and publish hx
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      # hx has zero production dependencies; install is only for devDeps and is
      # harmless. Keep it for parity + lockfile validation.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # One Vite build serves all four targets — the embedded assets are
      # target-independent; the per-target compiles below pick up the
      # generated src/ui-assets.gen.ts. Keep in sync with dev-build.yml.
      - name: Build web UI
        run: |
          cd ui
          bun install --frozen-lockfile
          bun run build
          cd ..
          bun run gen:ui

      - name: Read hx version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(bun -e 'import pkg from "./package.json"; console.log(pkg.version)')"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version must be a stable semver: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"


      - name: Compile darwin/linux binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          printf '%s\n' "${{ steps.version.outputs.value }}" > dist/hx-version

          for target in bun-darwin-arm64 bun-darwin-x64 bun-linux-arm64 bun-linux-x64; do
            out_name="hx-${target#bun-}"
            out_path="dist/${out_name}"
            build_target="$target"
            case "$target" in
              *-x64) build_target="${target}-baseline" ;;
            esac
            echo "::group::Build $out_name ($build_target)"
            bun build \
              --compile \
              --minify \
              --target="$build_target" \
              ./src/cli.ts \
              --outfile "$out_path"
            sha256sum "$out_path" | awk -v name="$out_name" '{print $1"  "name}' \
              > "${out_path}.sha256"
            gzip -9 -f "$out_path"
            ls -la "${out_path}.gz" "${out_path}.sha256"
            echo "::endgroup::"
          done

          # Windows ships TWO binaries from this same source: hx.exe (console —
          # the CLI needs somewhere to print) and hx-svc.exe (windowless, so the
          # scheduled task does not park a console window on the desktop).
          #
          # Both cross-compile from here. Bun's --windows-hide-console is refused
          # when cross-compiling, and building on a windows-latest runner instead
          # does NOT work: `--target=bun-windows-x64-baseline` fails there with
          # "Failed to extract executable", reproducibly, and dropping --target
          # would compile against the runner's non-baseline Bun and quietly
          # require AVX2 — the opposite of why every x64 target here is baseline.
          # So set the subsystem byte afterwards; that field is exactly what the
          # flag sets, and a patched binary was verified running as the scheduled
          # task on Windows 11 with no console window and its logs intact.
          for variant in cli svc; do
            case "$variant" in
              cli) out_name="hx-windows-x64" ;;
              svc) out_name="hx-windows-x64-svc" ;;
            esac
            out_path="dist/${out_name}"
            echo "::group::Build $out_name"
            bun build \
              --compile \
              --minify \
              --target=bun-windows-x64-baseline \
              ./src/cli.ts \
              --outfile "${out_path}.exe"
            if [ "$variant" = svc ]; then
              bun scripts/pe-subsystem.ts "${out_path}.exe"
            fi
            # Drop the extension so the ASSET name matches the scheme the
            # download proxy allowlist and detectTarget() both expect.
            mv "${out_path}.exe" "$out_path"
            sha256sum "$out_path" | awk -v name="$out_name" '{print $1"  "name}' \
              > "${out_path}.sha256"
            gzip -9 -f "$out_path"
            ls -la "${out_path}.gz" "${out_path}.sha256"
            echo "::endgroup::"
          done

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          tag="builds/hx-${version}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes
          fi
          git tag -f "$tag" "$GITHUB_SHA"
          git push origin --force "refs/tags/$tag"

          gh release create "$tag" dist/hx-* \
            --title "hx build v$version" \
            --notes "Build from ${GITHUB_SHA:0:8} (hx v$version)." \
            --prerelease=false \
            --latest=false

      - name: Publish immutable release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          tag="releases/hx-${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; skipping immutable release"
            exit 0
          fi
          gh release create "$tag" dist/hx-* \
            --title "hx v$version" \
            --notes "Published from ${GITHUB_SHA:0:8}." \
            --target "$GITHUB_SHA" \
            --latest=false
