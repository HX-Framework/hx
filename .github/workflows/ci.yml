name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ui/ is its own package: install pinned deps, build (which typechecks it
      # via `tsc -b`), then generate the embed manifest so the root typecheck
      # below also covers src/ui-assets.gen.ts exactly as a release build sees it.
      - name: Build web UI
        run: |
          cd ui
          bun install --frozen-lockfile
          bun run build
          cd ..
          bun run gen:ui

      - name: Typecheck
        run: bun run typecheck

      # Blocking lint = style + security rules (eslint-plugin-security).
      # See eslint.config.js and the OSS Readiness Plan, Part 4.3.
      - name: Lint (incl. security rules)
        run: bun run lint

      - name: Test
        run: bun test

  # Windows runs as a SEPARATE job, not a matrix leg of the one above.
  #
  # The repo ruleset requires a status check named exactly "Typecheck, lint, and
  # test". A matrix renames the context to "... (ubuntu-latest)", so the required
  # check would never report again and every PR — not just this one — would block
  # forever. A separate job keeps that contract intact and makes Windows additive:
  # promote it into the ruleset whenever the team wants it blocking.
  #
  # Why have it at all: the platform-dependent logic takes `platform` as a
  # defaulted parameter (pathnorm, windowsServiceBinary, ccdAppDir,
  # browserCommandFor), so win32 semantics are already covered from Linux. This
  # catches what that cannot — real path handling, real fs behavior, a real Bun.
  windows:
    name: Test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # One retry for the install: on 10-15 a fresh Windows runner failed to
      # extract @esbuild/win32-x64's tarball here ("Fail extracting tarball"),
      # 1 of 35 runs since 10-14. A real install error fails twice.
      - name: Build web UI
        shell: bash
        run: |
          cd ui
          bun install --frozen-lockfile || bun install --frozen-lockfile
          bun run build
          cd ..
          bun run gen:ui

      - name: Typecheck
        run: bun run typecheck

      # Lint stays on the Linux job only: the rules are platform-independent and
      # running eslint twice buys nothing.
      - name: Test
        run: bun test

  # Runs the rendered systemd unit under a real systemd USER manager and checks
  # that the background limits (Nice, IOSchedulingClass, CPUWeight, Memory*)
  # actually apply in a user unit, where the cgroup ones depend on which
  # controllers systemd delegates to the user manager. A separate job, like
  # the Windows one, so the required check above keeps its name.
  systemd-user:
    name: systemd user unit (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A hosted runner has no login session, so no user manager runs for the
      # runner user. Lingering starts one; systemctl --user reaches it through
      # $XDG_RUNTIME_DIR/systemd/private.
      - name: Start a systemd user manager
        run: |
          sudo loginctl enable-linger "$(id -un)"
          runtime="/run/user/$(id -u)"
          for _ in $(seq 1 50); do
            [ -S "$runtime/systemd/private" ] && break
            sleep 0.2
          done
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$runtime" systemctl --user show-environment > /dev/null

      - name: Test the unit under the user manager
        env:
          HX_TEST_SYSTEMD_USER: "1"
        run: bun test src/daemon.systemd-user.test.ts src/daemon.test.ts
