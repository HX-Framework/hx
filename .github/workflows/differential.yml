          if-no-files-found: warn

  # The background service through a real service manager, which the
  # harness's scenarios never install. First the exit check of the program's
  # "Build hx2" step: hx and hx2 share one service slot, and a device that
  # moves it from hx to hx2 and back loses nothing and uploads nothing twice
  # (harness/run/switch.ts). Then the service commands of both clients side
  # by side (harness/run/service-commands.ts). launchd and systemd run the
  # service with the runner's own HOME, so the fixture is linked into it
  # there; the container shell hook runs with the fixture as HOME.
  hx2-switch:
    name: The service, hx and hx2 (${{ matrix.manager }})
    needs: [reference, hx2-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, manager: shell-hook }
          - { os: ubuntu-latest, manager: systemd }
          - { os: macos-latest, manager: launchd }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hx-reference-${{ matrix.os }}
          path: bin/reference

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hx2-${{ matrix.os }}
          path: bin/hx2

      # A hosted runner has no login session, so no user manager runs for the
      # runner user (ci.yml's systemd-user job does the same).
      - name: Start a systemd user manager
        if: matrix.manager == 'systemd'
        run: |
          sudo loginctl enable-linger "$(id -un)"
          runtime="/run/user/$(id -u)"
          for _ in $(seq 1 50); do
            [ -S "$runtime/systemd/private" ] && break
            sleep 0.2
          done
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$runtime" systemctl --user show-environment > /dev/null

      - name: Move the service
        shell: bash
        run: |
          set -euo pipefail
          chmod +x bin/reference/hx bin/hx2/hx2
          bun harness/run/switch.ts --hx bin/reference/hx --hx2 bin/hx2/hx2 \
            --manager ${{ matrix.manager }} --out service-out/switch --work "$RUNNER_TEMP/hx-switch"

      # start, status, restart, stop, logs and uninstall, run by each client
      # in turn through the same manager and compared after normalization.
      - name: Compare the service commands
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bun harness/run/service-commands.ts --hx bin/reference/hx --hx2 bin/hx2/hx2 \
            --manager ${{ matrix.manager }} --out service-out/commands --work "$RUNNER_TEMP/hx-service-commands"

      - name: Report
        if: always()
        shell: bash
        run: |
          for f in service-out/switch/report.md service-out/commands/report.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: harness-hx2-service-${{ matrix.manager }}
          path: service-out
          if-no-files-found: warn
