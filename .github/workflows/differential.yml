name: Differential harness

# Runs two hx binaries — the pinned REFERENCE (harness/reference.lock.json)
# and a CANDIDATE — through the same generated fixture homes and the same
# fault scenarios against a recording fake gateway, and fails on any
# difference in what leaves the binary. See harness/README.md.
#
# Four jobs run on every pull request:
#   self          the candidate compared with itself, three runs in a row:
#                 the harness is deterministic;
#   differential  the reference compared with the candidate: the change
#                 under review alters nothing a server, a person or the hx ui
#                 can see (or the pull request says why);
#   caught        the reference compared with deliberately broken candidates:
#                 the harness detects a changed chunk size, a dropped byte and
#                 a dropped metadata field;
#   measure       both binaries under rusage and strace: disk writes per pass,
#                 file checks per second at idle, refused workflow retries,
#                 the Claude Desktop index — the numbers behind the design
#                 fixes (harness/run/measure.ts), attached as an artifact.
#
# The candidate is any binary: built from the pull request by default, or —
# on a manual run — from another ref, or downloaded from a URL (an hx2
# release asset, say) with `candidate_name: hx2`.

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: "Git ref to build the candidate from (empty: this ref)"
        required: false
        default: ""
      candidate_url_linux:
        description: "URL of a gzipped candidate binary for linux-x64 (e.g. an hx2-linux-x64.gz release asset); overrides candidate_ref on Linux"
        required: false
        default: ""
      candidate_url_macos:
        description: "URL of a gzipped candidate binary for darwin-arm64; overrides candidate_ref on macOS"
        required: false
        default: ""
      candidate_name:
        description: "The name the candidate prints and uses in its User-Agent and asset names: hx or hx2"
        required: false
        default: "hx"
      reference_ref:
        description: "Git ref for the reference build (empty: harness/reference.lock.json)"
        required: false
        default: ""
      scenarios:
        description: "Comma-separated scenario names, or all"
        required: false
        default: "all"

permissions:
  contents: read

concurrency:
  group: differential-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"
  SCENARIOS: ${{ github.event.inputs.scenarios || 'all' }}
  CANDIDATE_NAME: ${{ github.event.inputs.candidate_name || 'hx' }}

jobs:
  reference:
    name: Build the reference (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve the reference commit
        id: lock
        shell: bash
        env:
          REFERENCE_REF: ${{ github.event.inputs.reference_ref }}
        run: |
          set -euo pipefail
          ref="$REFERENCE_REF"
          if [ -z "$ref" ]; then
            ref="$(node -e 'console.log(require("./harness/reference.lock.json").commit)')"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "reference: $ref"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.lock.outputs.ref }}
          path: reference-src

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build
        run: bash harness/ci/build.sh "$PWD/reference-src" "$PWD/bin/hx"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hx-reference-${{ matrix.os }}
          path: bin/hx
          if-no-files-found: error

  candidate:
    name: Build the candidate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.inputs.candidate_ref || github.ref }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Pick the candidate source
        id: pick
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
          URL_LINUX: ${{ github.event.inputs.candidate_url_linux }}
          URL_MACOS: ${{ github.event.inputs.candidate_url_macos }}
        run: |
          set -euo pipefail
          url=""
          case "$MATRIX_OS" in
            ubuntu-latest) url="$URL_LINUX" ;;
            macos-latest)  url="$URL_MACOS" ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Download the candidate binary
        if: steps.pick.outputs.url != ''
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.pick.outputs.url }}
        run: |
          set -euo pipefail
          mkdir -p bin
          curl -fsSL "$CANDIDATE_URL" -o bin/candidate.gz
          gunzip -c bin/candidate.gz > bin/hx
          rm bin/candidate.gz
          chmod +x bin/hx
          bin/hx --version

      - name: Build the candidate from source
        if: steps.pick.outputs.url == ''
        run: bash harness/ci/build.sh "$PWD" "$PWD/bin/hx"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hx-candidate-${{ matrix.os }}
          path: bin/hx
          if-no-files-found: error

  broken:
    name: Build a broken candidate (${{ matrix.patch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        patch: [chunk-limit, drop-newline, commit-meta]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Break it
        env:
          PATCH: ${{ matrix.patch }}
        run: git apply --verbose "harness/broken/$PATCH.patch"

      - name: Build
        run: bash harness/ci/build.sh "$PWD" "$PWD/bin/hx"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hx-broken-${{ matrix.patch }}
          path: bin/hx
          if-no-files-found: error

  self:
    name: Candidate vs itself, run ${{ matrix.run }} (${{ matrix.os }})
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        run: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hx-candidate-${{ matrix.os }}
          path: bin/candidate

      - name: Run the harness
        shell: bash
        run: |
          set -euo pipefail
          chmod +x bin/candidate/hx
          bun harness/run/run-harness.ts \
            --reference bin/candidate/hx --reference-name "$CANDIDATE_NAME" \
            --candidate bin/candidate/hx --candidate-name "$CANDIDATE_NAME" \
            --scenarios "$SCENARIOS" --out harness-out --work "$RUNNER_TEMP/hx-harness"

      - name: Report
        if: always()
        shell: bash
        run: |
          if [ -f harness-out/report.md ]; then cat harness-out/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: harness-self-${{ matrix.os }}-run${{ matrix.run }}
          path: harness-out
          if-no-files-found: warn

  differential:
    name: Reference vs candidate (${{ matrix.os }})
    needs: [reference, candidate]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hx-reference-${{ matrix.os }}
          path: bin/reference

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hx-candidate-${{ matrix.os }}
          path: bin/candidate

      - name: Run the harness
        shell: bash
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          set -euo pipefail
          chmod +x bin/reference/hx bin/candidate/hx
          bun harness/run/run-harness.ts \
            --reference bin/reference/hx \
            --candidate bin/candidate/hx --candidate-name "$CANDIDATE_NAME" \
            --scenarios "$SCENARIOS" --out harness-out --work "$RUNNER_TEMP/hx-harness" \
            --goldens "harness/golden/$RUNNER_OS_NAME" --write-goldens "harness-out/goldens/$RUNNER_OS_NAME"

      - name: Report
        if: always()
        shell: bash
        run: |
          if [ -f harness-out/report.md ]; then cat harness-out/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: harness-differential-${{ matrix.os }}
          path: harness-out
          if-no-files-found: warn

  measure:
    name: Measure the design fixes (${{ matrix.os }})
    needs: [reference, candidate]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # strace counts the daemon's system calls at idle (file checks per
      # second). Linux only; macOS reports CPU, RSS and block I/O from rusage.
      - name: Install strace
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq strace > /dev/null

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hx-reference-${{ matrix.os }}
          path: bin/reference

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hx-candidate-${{ matrix.os }}
          path: bin/candidate

      - name: Measure
        shell: bash
        run: |
          set -euo pipefail
          chmod +x bin/reference/hx bin/candidate/hx
          bun harness/run/measure.ts \
            --reference bin/reference/hx --candidate bin/candidate/hx \
            --out measure-out --work "$RUNNER_TEMP/hx-measure"

      - name: Report
        if: always()
        shell: bash
        run: |
          if [ -f measure-out/measurements.md ]; then cat measure-out/measurements.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: harness-measure-${{ matrix.os }}
          path: measure-out
          if-no-files-found: warn

  caught:
    name: A broken candidate is caught (${{ matrix.patch }})
    needs: [reference, broken]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        patch: [chunk-limit, drop-newline, commit-meta]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hx-reference-ubuntu-latest
          path: bin/reference

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hx-broken-${{ matrix.patch }}
          path: bin/broken

      - name: Run the harness, expecting a difference
        shell: bash
        run: |
          set -euo pipefail
          chmod +x bin/reference/hx bin/broken/hx
          bun harness/run/run-harness.ts \
            --reference bin/reference/hx --candidate bin/broken/hx \
            --scenarios baseline --expect fail --out harness-out --work "$RUNNER_TEMP/hx-harness"

      - name: Report
        if: always()
        shell: bash
        run: |
          if [ -f harness-out/report.md ]; then cat harness-out/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: harness-caught-${{ matrix.patch }}
          path: harness-out/report.md
          if-no-files-found: warn
