name: Differential harness

# Runs two hx binaries — the pinned REFERENCE (harness/reference.lock.json)
# and a CANDIDATE — through the same generated fixture homes and the same
# fault scenarios against a recording fake gateway, and fails on any
# difference in what leaves the binary. See harness/README.md.
#
# Six jobs run on every pull request:
#   self          the candidate compared with itself, three runs in a row:
#                 the harness is deterministic (every scenario but the
#                 hot-path shapes);
#   differential  the reference compared with the candidate: the change
#                 under review alters nothing a server, a person or the hx ui
#                 can see (or the pull request says why);
#   self-hot, differential-hot
#                 the same two on the hot-path shapes (hot-10k above all),
#                 in jobs of their own: on Linux the runner has shut the
#                 TypeScript jobs down 16 to 21 minutes in while hot-10k ran
#                 ("The runner has received a shutdown signal"), so these
#                 sample the machine's memory every 10 s into the step log;
#   caught        the reference compared with deliberately broken candidates:
#                 the harness detects a changed chunk size, a dropped byte and
#                 a dropped metadata field;
#   measure       both binaries under rusage and strace: disk writes per pass,
#                 file checks per second at idle, refused workflow retries,
#                 the Claude Desktop index — the numbers behind the design
#                 fixes (harness/run/measure.ts), attached as an artifact.
#                 The idle daemon's resident memory is sampled once a second
#                 from /proc (Linux) or ps (macOS); on Linux a third binary,
#                 the candidate with file events patched off
#                 (harness/variants/no-file-events.patch), is measured beside
#                 the two, so the recursive watch's memory stands on its own.
#
# The candidate is any binary: built from the pull request by default, or —
# on a manual run — from another ref, or downloaded from a URL (an hx2
# release asset, say) with `candidate_name: hx2`.
#
# On the hx-2.0 branch five more jobs run the Rust port (hx2/, the whole
# client since M5) against the same reference:
#   hx2-build         the web UI (bun), then cargo build --release and the
#                     unit tests on both runners; the tests check the service
#                     definitions against the TypeScript client's renderings;
#   hx2-differential  the reference compared with hx2 on every scenario but
#                     the hot-path shapes (`--scenarios main`: the daemon, the
#                     CLI, the hx ui API, update, connect and disconnect),
#                     passed as `candidate_name: hx2`, with the goldens; the
#                     hot-path shapes in hx2-differential-hot, as for the
#                     TypeScript jobs, both sampling the runner's memory;
#   hx2-self          hx2 compared with itself on the same scenarios
#                     (hx2-self-hot for the hot-path shapes);
#   hx2-measure       harness/run/measure.ts with hx2 as the candidate:
#                     the founder-sized tree (4,800 transcripts, 36,000
#                     Claude Desktop files) for memory and idle CPU, the idle
#                     shapes under strace, and the Claude Desktop index;
#   hx2-switch        a device moves its one service slot from hx to hx2 and
#                     back through launchd, systemd and the container shell
#                     hook, and loses nothing and uploads nothing twice
#                     (harness/run/switch.ts); then both clients run the
#                     service commands through the same manager, compared
#                     after normalization (harness/run/service-commands.ts).

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: "Git ref to build the candidate from (empty: this ref)"
        required: false
        default: ""
      candidate_url_linux:
        description: "URL of a gzipped candidate binary for linux-x64 (e.g. an hx2-linux-x64.gz release asset); overrides candidate_ref on Linux"
        required: false
        default: ""
      candidate_url_macos:
        description: "URL of a gzipped candidate binary for darwin-arm64; overrides candidate_ref on macOS"
        required: false
        default: ""
      candidate_name:
        description: "The name the candidate prints and uses in its User-Agent and asset names: hx or hx2"
        required: false
        default: "hx"
      reference_ref:
        description: "Git ref for the reference build (empty: harness/reference.lock.json)"
        required: false
        default: ""
      scenarios:
        description: "Comma-separated scenario names, or all | main | hot-path | daemon"
        required: false
        default: "all"

permissions:
  contents: read

concurrency:
  group: differential-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"
  SCENARIOS: ${{ github.event.inputs.scenarios || 'all' }}
  CANDIDATE_NAME: ${{ github.event.inputs.candidate_name || 'hx' }}

jobs:
  reference:
    name: Build the reference (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve the reference commit
        id: lock
        shell: bash
        env:
          REFERENCE_REF: ${{ github.event.inputs.reference_ref }}
        run: |
          set -euo pipefail
          ref="$REFERENCE_REF"
          if [ -z "$ref" ]; then
            ref="$(node -e 'console.log(require("./harness/reference.lock.json").commit)')"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "reference: $ref"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.lock.outputs.ref }}
          path: reference-src

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build
        run: bash harness/ci/build.sh "$PWD/reference-src" "$PWD/bin/hx"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hx-reference-${{ matrix.os }}
          path: bin/hx
          if-no-files-found: error

  candidate:
    name: Build the candidate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.inputs.candidate_ref || github.ref }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Pick the candidate source
        id: pick
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
          URL_LINUX: ${{ github.event.inputs.candidate_url_linux }}
          URL_MACOS: ${{ github.event.inputs.candidate_url_macos }}
        run: |
          set -euo pipefail
          url=""
          case "$MATRIX_OS" in
            ubuntu-latest) url="$URL_LINUX" ;;
            macos-latest)  url="$URL_MACOS" ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Download the candidate binary
        if: steps.pick.outputs.url != ''
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.pick.outputs.url }}
        run: |
          set -euo pipefail
          mkdir -p bin
          curl -fsSL "$CANDIDATE_URL" -o bin/candidate.gz
          gunzip -c bin/candidate.gz > bin/hx
          rm bin/candidate.gz
          chmod +x bin/hx
          bin/hx --version

      - name: Build the candidate from source
        if: steps.pick.outputs.url == ''
        run: bash harness/ci/build.sh "$PWD" "$PWD/bin/hx"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hx-candidate-${{ matrix.os }}
          path: bin/hx
          if-no-files-found: error

  broken:
    name: Build a broken candidate (${{ matrix.patch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        patch: [chunk-limit, drop-newline, commit-meta]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Break it
        env:
          PATCH: ${{ matrix.patch }}
        run: git apply --verbose "harness/broken/$PATCH.patch"

      - name: Build
        run: bash harness/ci/build.sh "$PWD" "$PWD/bin/hx"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hx-broken-${{ matrix.patch }}
          path: bin/hx
          if-no-files-found: error

  self:
    name: Candidate vs itself, run ${{ matrix.run }} (${{ matrix.os }})
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        run: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hx-candidate-${{ matrix.os }}
          path: bin/candidate

      - name: Run the harness
        shell: bash
        run: |
          set -euo pipefail
          chmod +x bin/candidate/hx
          # The hot-path shapes run in self-hot; "all" means everything else here.
          scen="$SCENARIOS"; [ "$scen" = all ] && scen=main
          bun harness/run/run-harness.ts \
            --reference bin/candidate/hx --reference-name "$CANDIDATE_NAME" \
            --candidate bin/candidate/hx --candidate-name "$CANDIDATE_NAME" \
            --scenarios "$scen" --out harness-out --work "$RUNNER_TEMP/hx-harness"

      - name: Report
        if: always()
        shell: bash
        run: |
          if [ -f harness-out/report.md ]; then cat harness-out/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: harness-self-${{ matrix.os }}-run${{ matrix.run }}
          path: harness-out
          if-no-files-found: warn

  differential:
    name: Reference vs candidate (${{ matrix.os }})
    needs: [reference, candidate]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hx-reference-${{ matrix.os }}
          path: bin/reference

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hx-candidate-${{ matrix.os }}
          path: bin/candidate

      - name: Run the harness
        shell: bash
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          set -euo pipefail
          chmod +x bin/reference/hx bin/candidate/hx
          # The hot-path shapes run in differential-hot; "all" means everything else here.
          scen="$SCENARIOS"; [ "$scen" = all ] && scen=main
          bun harness/run/run-harness.ts \
            --reference bin/reference/hx \
            --candidate bin/candidate/hx --candidate-name "$CANDIDATE_NAME" \
            --scenarios "$scen" --out harness-out --work "$RUNNER_TEMP/hx-harness" \
            --goldens "harness/golden/$RUNNER_OS_NAME" --write-goldens "harness-out/goldens/$RUNNER_OS_NAME"

      - name: Report
        if: always()
        shell: bash
        run: |
          if [ -f harness-out/report.md ]; then cat harness-out/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: harness-differential-${{ matrix.os }}
          path: harness-out
          if-no-files-found: warn

  self-hot:
    name: Candidate vs itself, hot path, run ${{ matrix.run }} (${{ matrix.os }})
    needs: candidate
    if: ${{ (github.event.inputs.scenarios || 'all') == 'all' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        run: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hx-candidate-${{ matrix.os }}
          path: bin/candidate

      - name: Run the harness on the hot-path scenarios, sampling memory
        shell: bash
        run: |
          set -euo pipefail
          chmod +x bin/candidate/hx
          mkdir -p harness-out
          # On Linux the runner shut the TypeScript hot-path jobs down 16 to
          # 21 minutes in, during or after hot-10k ("The runner has received
          # a shutdown signal"). Sample the machine every 10 s into the step
          # log (live, so it survives a shutdown) and into memory.log.
          sample() {
            while true; do
              echo "--- memory $(date -u +%FT%TZ)"
              if [ "$RUNNER_OS" = Linux ]; then
                free -m | sed -n '1,3p'
                ps -eo pid,rss,pcpu,etime,comm --sort=-rss | head -6
              else
                vm_stat | sed -n '1,8p'
                ps -eo pid,rss,pcpu,etime,comm -r | head -6
              fi
              df -h "$RUNNER_TEMP" | tail -1
              sleep 10
            done
          }
          ( sample 2>&1 | tee harness-out/memory.log ) &
          sampler=$!
          trap 'kill $sampler 2>/dev/null || true' EXIT
          bun harness/run/run-harness.ts \
            --reference bin/candidate/hx --reference-name "$CANDIDATE_NAME" \
            --candidate bin/candidate/hx --candidate-name "$CANDIDATE_NAME" \
            --scenarios hot-path --out harness-out --work "$RUNNER_TEMP/hx-harness"

      - name: Report
        if: always()
        shell: bash
        run: |
          if [ -f harness-out/report.md ]; then cat harness-out/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: harness-self-hot-${{ matrix.os }}-run${{ matrix.run }}
          path: harness-out
          if-no-files-found: warn

  differential-hot:
    name: Reference vs candidate, hot path (${{ matrix.os }})
    needs: [reference, candidate]
    if: ${{ (github.event.inputs.scenarios || 'all') == 'all' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hx-reference-${{ matrix.os }}
          path: bin/reference

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hx-candidate-${{ matrix.os }}
          path: bin/candidate

      - name: Run the harness on the hot-path scenarios, sampling memory
        shell: bash
        run: |
          set -euo pipefail
          chmod +x bin/reference/hx bin/candidate/hx
          mkdir -p harness-out
          # On Linux the runner shut the TypeScript hot-path jobs down 16 to
          # 21 minutes in, during or after hot-10k ("The runner has received
          # a shutdown signal"). Sample the machine every 10 s into the step
          # log (live, so it survives a shutdown) and into memory.log.
          sample() {
            while true; do
              echo "--- memory $(date -u +%FT%TZ)"
              if [ "$RUNNER_OS" = Linux ]; then
                free -m | sed -n '1,3p'
                ps -eo pid,rss,pcpu,etime,comm --sort=-rss | head -6
              else
                vm_stat | sed -n '1,8p'
                ps -eo pid,rss,pcpu,etime,comm -r | head -6
              fi
              df -h "$RUNNER_TEMP" | tail -1
              sleep 10
            done
          }
          ( sample 2>&1 | tee harness-out/memory.log ) &
          sampler=$!
          trap 'kill $sampler 2>/dev/null || true' EXIT
          bun harness/run/run-harness.ts \
            --reference bin/reference/hx \
            --candidate bin/candidate/hx --candidate-name "$CANDIDATE_NAME" \
            --scenarios hot-path --out harness-out --work "$RUNNER_TEMP/hx-harness"

      - name: Report
        if: always()
        shell: bash
        run: |
          if [ -f harness-out/report.md ]; then cat harness-out/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: harness-differential-hot-${{ matrix.os }}
          path: harness-out
          if-no-files-found: warn

  measure:
    name: Measure the design fixes (${{ matrix.os }})
    needs: [reference, candidate]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # strace counts the daemon's system calls at idle (file checks per
      # second). Linux only; macOS reports CPU, RSS and block I/O from rusage.
      - name: Install strace
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq strace > /dev/null

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hx-reference-${{ matrix.os }}
          path: bin/reference

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hx-candidate-${{ matrix.os }}
          path: bin/candidate

      # The variant: the candidate's source with file events patched off,
      # built here (Linux only; a downloaded candidate has no source to patch).
      # A patch that no longer applies skips the variant with a warning rather
      # than failing the measurement.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: runner.os == 'Linux' && github.event.inputs.candidate_url_linux == ''
        with:
          ref: ${{ github.event.inputs.candidate_ref || github.ref }}
          path: variant-src

      - name: Build the candidate with file events off
        if: runner.os == 'Linux' && github.event.inputs.candidate_url_linux == ''
        shell: bash
        run: |
          set -euo pipefail
          patch="$PWD/harness/variants/no-file-events.patch"
          if git -C variant-src apply --check "$patch"; then
            git -C variant-src apply --verbose "$patch"
            bash harness/ci/build.sh "$PWD/variant-src" "$PWD/bin/variant/hx"
          else
            echo "::warning::harness/variants/no-file-events.patch does not apply to the candidate; the variant is skipped"
          fi

      - name: Measure
        shell: bash
        run: |
          set -euo pipefail
          chmod +x bin/reference/hx bin/candidate/hx
          extra=()
          if [ -x bin/variant/hx ]; then
            extra=(--variant bin/variant/hx --variant-name "file events off")
          fi
          bun harness/run/measure.ts \
            --reference bin/reference/hx --candidate bin/candidate/hx \
            ${extra[@]+"${extra[@]}"} \
            --out measure-out --work "$RUNNER_TEMP/hx-measure"

      - name: Report
        if: always()
        shell: bash
        run: |
          if [ -f measure-out/measurements.md ]; then cat measure-out/measurements.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: harness-measure-${{ matrix.os }}
          path: measure-out
          if-no-files-found: warn

  caught:
    name: A broken candidate is caught (${{ matrix.patch }})
    needs: [reference, broken]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        patch: [chunk-limit, drop-newline, commit-meta]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hx-reference-ubuntu-latest
          path: bin/reference

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hx-broken-${{ matrix.patch }}
          path: bin/broken

      - name: Run the harness, expecting a difference
        shell: bash
        run: |
          set -euo pipefail
          chmod +x bin/reference/hx bin/broken/hx
          bun harness/run/run-harness.ts \
            --reference bin/reference/hx --candidate bin/broken/hx \
            --scenarios baseline --expect fail --out harness-out --work "$RUNNER_TEMP/hx-harness"

      - name: Report
        if: always()
        shell: bash
        run: |
          if [ -f harness-out/report.md ]; then cat harness-out/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: harness-caught-${{ matrix.patch }}
          path: harness-out/report.md
          if-no-files-found: warn

  hx2-build:
    name: Build hx2 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The Rust toolchain lives on the runner only; nothing in this program
      # builds on a laptop.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: hx2

      # `hx ui` serves the React app as built: the same ui/ sources, lockfile
      # and Bun as the TypeScript build (harness/ci/build.sh), embedded into
      # the binary by hx2/build.rs.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build the web UI
        shell: bash
        run: |
          set -euo pipefail
          cd ui
          bun install --frozen-lockfile
          bun run build

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path hx2/Cargo.toml
          mkdir -p bin
          cp hx2/target/release/hx2 bin/hx2
          ls -l bin/hx2
          bin/hx2 --version

      # The unit tests, among them the service definitions against the
      # TypeScript client's own renderings for the same binary and HOME
      # (one service slot: the files may differ in the binary's path alone).
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          # Both renderings take their log and state paths from the same HOME.
          defs="$RUNNER_TEMP/service-defs"
          bun harness/run/service-defs.ts --out "$defs"
          HX2_TS_SERVICE_DEFS="$defs" cargo test --manifest-path hx2/Cargo.toml

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hx2-${{ matrix.os }}
          path: bin/hx2
          if-no-files-found: error

  hx2-differential:
    name: Reference vs hx2 (${{ matrix.os }})
    needs: [reference, hx2-build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hx-reference-${{ matrix.os }}
          path: bin/reference

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hx2-${{ matrix.os }}
          path: bin/hx2

      # The work dir is the TypeScript jobs' (`hx-harness`, not `hx2-harness`):
      # the fixture home's path is written into every transcript, so the
      # goldens hold the file sizes of that path's length, and the candidate's
      # name is normalized in its output before the home path is masked, so a
      # home path spelling "hx2" would come out of the first step unmaskable.
      - name: Run the harness, sampling memory
        shell: bash
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          set -euo pipefail
          chmod +x bin/reference/hx bin/hx2/hx2
          mkdir -p harness-out
          # The runner shut the all-scenario hx2 job down two minutes into
          # hot-10k on Linux, after the TypeScript jobs had met the same end
          # 16 to 21 minutes in: the harness driver (one bun process hosting
          # the fake gateway) reaches several GB there. Sample the machine
          # every 10 s into the step log (live, so it survives a shutdown)
          # and into memory.log.
          sample() {
            while true; do
              echo "--- memory $(date -u +%FT%TZ)"
              if [ "$RUNNER_OS" = Linux ]; then
                free -m | sed -n '1,3p'
                ps -eo pid,rss,pcpu,etime,comm --sort=-rss | head -6
              else
                vm_stat | sed -n '1,8p'
                ps -eo pid,rss,pcpu,etime,comm -r | head -6
              fi
              df -h "$RUNNER_TEMP" | tail -1
              sleep 10
            done
          }
          ( sample 2>&1 | tee harness-out/memory.log ) &
          sampler=$!
          trap 'kill $sampler 2>/dev/null || true' EXIT
          bun harness/run/run-harness.ts \
            --reference bin/reference/hx \
            --candidate bin/hx2/hx2 --candidate-name hx2 \
            --scenarios main --out harness-out --work "$RUNNER_TEMP/hx-harness" \
            --goldens "harness/golden/$RUNNER_OS_NAME" --write-goldens "harness-out/goldens/$RUNNER_OS_NAME"

      - name: Report
        if: always()
        shell: bash
        run: |
          if [ -f harness-out/report.md ]; then cat harness-out/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: harness-hx2-differential-${{ matrix.os }}
          path: harness-out
          if-no-files-found: warn

