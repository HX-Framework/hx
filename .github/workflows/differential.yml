          bun-version: ${{ env.BUN_VERSION }}

      - name: Install strace
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq strace > /dev/null

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
